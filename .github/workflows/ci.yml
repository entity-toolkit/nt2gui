name: CI

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run test:client
      - run: npm run build
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: pip install build
      - run: npm run package
      # The wheel must run on its own: install it outside the checkout.
      - name: Smoke-test the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv venv
          venv/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          venv/bin/nt2gui --version
          venv/bin/python -c "import nt2gui.app as a; assert (a.STATIC_DIR / 'index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Tag `vX.Y.Z` (matching `version` in pyproject.toml) to release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
