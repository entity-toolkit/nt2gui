[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nt2gui"
version = "0.1.0"
description = "Browser UI for visualizing Entity simulation output, served from where the data lives."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hayk Hakobyan", email = "hhakobyan@flatironinstitute.org" }]
dependencies = [
  "flask>=3.0",
  "waitress>=3.0",
  "pydantic>=2.5",
  "numpy>=1.26",
  "xarray>=2024.1",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "nt2py[hdf5]>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright", "build"]

[project.scripts]
nt2gui = "nt2gui.cli:main"

[project.urls]
Repository = "https://github.com/haykh/nt2gui"

[tool.hatch.build]
# The built client (`npm run build`) is gitignored, so list it explicitly.
artifacts = ["nt2gui/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["nt2gui"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["nt2gui", "tests", "README.md", "hatch_build.py"]
